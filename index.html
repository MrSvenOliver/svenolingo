<style>
:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --surface-2:#F5EEE4; --surface-3:#EFE6DA;
  --ink:#2B2621; --ink-2:#51483F; --ink-3:#7A6F64; --line:#E8DFD3;
  --accent:#B5523B; --accent-ink:#8F3E2B; --accent-soft:#F7E6DF;
  --gold:#C99A3E; --gold-soft:#F6EBD3;
  --ok:#4E7B58; --ok-soft:#E4EFE3; --bad:#B0463D; --bad-soft:#F7E2DF;
  --shadow:0 1px 2px rgba(70,45,20,.05),0 10px 28px rgba(70,45,20,.07);
  --shadow-lift:0 2px 4px rgba(70,45,20,.06),0 16px 36px rgba(70,45,20,.11);
  --r:20px; --r-sm:14px; --r-xs:10px;
  --gap:24px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
.page{max-width:860px;margin:0 auto;padding:28px 32px 72px}
.page.wide{max-width:1240px}
.head{display:grid;grid-template-columns:140px 1fr 140px;align-items:center;margin:4px 0 28px;min-height:44px}
.head h1{grid-column:2;margin:0;text-align:center;font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:.2px}
.head .sub{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--ink-2);margin-top:4px;letter-spacing:0}
.back{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;color:var(--ink-2);font-size:15px;transition:background .15s}
.back:hover{background:var(--surface-3);color:var(--ink)}
.home-btn{position:fixed;top:18px;right:22px;width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;z-index:20;transition:transform .15s,box-shadow .15s}
.home-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.center{text-align:center}

/* Brand */
.brand{text-align:center;margin:8px 0 26px}
.brand .mark{font-family:var(--serif);font-size:40px;font-weight:600;letter-spacing:.3px}
.brand .mark em{font-style:normal;color:var(--accent)}
.brand .tagline{color:var(--ink-2);margin-top:4px}

/* Dashboard */
.dash{padding:26px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;align-items:center}
.stat{display:flex;align-items:center;gap:14px}
.stat .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface-2)}
.stat .num{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1}
.stat .lbl{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.goalbar{grid-column:1/-1}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.goalbar .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.cta{grid-column:1/-1;display:flex;gap:14px;align-items:stretch}
.btn-hero{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 22px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:19px;font-weight:600;box-shadow:0 6px 18px rgba(181,82,59,.28);transition:transform .15s,background .15s}
.btn-hero:hover{background:var(--accent-ink);transform:translateY(-1px)}
.btn-hero .cnt{font-weight:500;font-size:14px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px}
.toggle{display:flex;align-items:center;gap:12px;padding:0 18px;border-radius:var(--r-sm);background:var(--surface-2);font-size:15px;white-space:nowrap}
.switch{width:46px;height:26px;border-radius:99px;background:#D8CDBF;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.hint{grid-column:1/-1;font-size:13.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--r-xs);padding:10px 14px}

/* Tiles */
.tiles{display:grid;gap:var(--gap)}
.tiles.t3{grid-template-columns:repeat(3,1fr);margin-top:var(--gap)}
.tiles.t2{grid-template-columns:repeat(2,1fr);margin-top:var(--gap)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap)}
.quickbtn{display:flex;align-items:center;gap:16px;padding:18px 22px;text-align:left;transition:transform .15s,box-shadow .15s}
.quickbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.quickbtn:disabled{opacity:.55}
.quickbtn .qe{font-size:30px}
.quickbtn b{font-family:var(--serif);font-size:18px;display:block}
.quickbtn .qs{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.section-label+.tiles.t3c,.section-label+.actions{margin-top:16px}
.head+.section-label{margin-top:0}
.gram{padding:8px 30px 22px}
.gblock{padding:20px 0;border-bottom:1px solid var(--line)}
.gblock h3{margin:0 0 8px;font-family:var(--serif);font-size:20px}
.gblock p{margin:0 0 6px;color:var(--ink-2)}
.grows{display:flex;flex-direction:column;margin-top:8px}
.grow{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:9px 0;border-top:1px dashed var(--line)}
.grow:first-child{border-top:0}
.grow .gk{font-weight:600}
.grow .gv{color:var(--ink-2)}
.grow.say{grid-template-columns:150px 1fr 200px;align-items:center}
.grow .gx{display:flex;align-items:center;gap:10px}
.grow .gp{font-size:13px;color:var(--accent-ink)}
.src{padding-top:16px;font-size:12.5px;color:var(--ink-3)}
.vempty{padding:30px;text-align:center;color:var(--ink-2)}
.verb-extra{text-align:center;color:var(--ink-2);margin:-8px 0 18px;font-size:14.5px}
.tiles.t3c{display:flex;flex-wrap:wrap;justify-content:center}
.tiles.t3c>.tile{width:calc((100% - 2 * var(--gap)) / 3);min-height:0}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s;min-height:100%}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.tile .em{font-size:34px;line-height:1;margin-bottom:6px}
.tile.big{padding:20px 18px 16px}
.tile.big .em{font-size:34px;margin-bottom:2px}
.tile .tt{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25}
.tile.big .tt{font-size:19.5px}
.tile .ts{font-size:13.5px;color:var(--ink-2)}
.tile .bar{width:100%;height:7px;margin-top:auto}
.tile .pct{font-size:13px;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}
.tile .foot{width:100%;margin-top:auto;padding-top:12px}
.tile.hardtile{grid-column:1/-1;background:linear-gradient(135deg,#2E2622,#4A2F28);color:#F6EDE4;flex-direction:row;justify-content:center;align-items:center;gap:18px;text-align:left;padding:14px 24px}
.tile.hardtile .em{font-size:30px;margin-bottom:0}
.tile.hardtile .hinfo{flex:1;display:flex;flex-direction:column;gap:4px}
.tile.hardtile .tt{color:#FFF6EC}
.tile.hardtile .ts{color:#D9C8B8}
.tile.hardtile .foot{width:260px;margin-top:0}
.tile.hardtile .pct{color:#D9C8B8}
.tile.hardtile .bar{background:rgba(255,255,255,.18)}
.tile.hardsub{border-top:4px solid #4A2F28}
.tiles.t2c{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.tiles.t2c>.tile{width:calc((100% - var(--gap)) / 2);min-height:0}
.card.hard-hero{display:flex;align-items:center;gap:22px;padding:22px 26px;margin-bottom:var(--gap);background:linear-gradient(135deg,#2E2622,#4A2F28);color:#F6EDE4}
.card.hard-hero .em{font-size:44px}
.card.hard-hero .info{flex:1}
.card.hard-hero .bar{margin-top:12px;background:rgba(255,255,255,.18)}
.card.gram.hard{border-top:5px solid #4A2F28}
.q-sec.hard{background:#2E2622;color:#FFF6EC}
.tile.special{background:linear-gradient(160deg,#FFF9EE,#FCEFE9);border:1.5px dashed #E2C7B7;box-shadow:none}
.tile.special:hover{box-shadow:var(--shadow)}

/* Category page */
.cat-hero{padding:26px 28px;display:flex;align-items:center;gap:22px}
.cat-hero .em{font-size:50px}
.cat-hero .info{flex:1}
.cat-hero .bar{margin-top:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:var(--gap)}
.action{padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.action .em{font-size:32px}
.action .tt{font-family:var(--serif);font-size:19px;font-weight:600}
.action .ts{font-size:13.5px;color:var(--ink-2)}
.note{margin-top:var(--gap);padding:22px 26px}
.note h3{margin:0 0 10px;font-family:var(--serif);font-size:19px}
.note p{margin:6px 0;color:var(--ink-2)}
.note b{color:var(--ink)}

/* Speaker buttons (einheitlich) */
.spk{border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;flex:none;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(181,82,59,.25)}
.spk:hover{background:var(--accent-ink);transform:scale(1.05)}
.spk:active{transform:scale(.96)}
.spk svg{display:block}
.spk-sm{width:34px;height:34px;box-shadow:0 2px 6px rgba(181,82,59,.22)}
.spk-sm svg{width:17px;height:17px}
.spk-md{width:48px;height:48px}
.spk-md svg{width:22px;height:22px}
.spk-lg{width:68px;height:68px}
.spk-lg svg{width:30px;height:30px}
.spk-xl{width:104px;height:104px}
.spk-xl svg{width:46px;height:46px}
.spk.off{background:#D8CDBF;box-shadow:none;pointer-events:none}
.slow{font-size:13.5px;color:var(--ink-2);padding:6px 12px;border-radius:99px;background:var(--surface-2)}
.slow:hover{background:var(--surface-3)}

/* List */
.list{padding:8px 0}
.lrow{display:grid;grid-template-columns:52px 1.25fr 1.1fr 1.1fr 64px;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .es{font-weight:600;font-size:17px}
.lrow .pl{display:block;font-size:13px;color:var(--ink-3);font-weight:400}
.lrow .pr{font-size:14px;color:var(--accent-ink);letter-spacing:.2px}
.lrow .de{color:var(--ink-2)}
.dots{display:flex;gap:4px;justify-content:flex-end}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.dots i.on{background:var(--gold)}
.lrow.s{grid-template-columns:52px 1.6fr 1.3fr 64px}
.lrow.s .pr{display:block;margin-top:2px;font-size:13px}

/* Verb table */
.vtab{padding:6px 0}
.vrow{display:grid;grid-template-columns:52px 170px 130px 120px 1fr 64px;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .pn{color:var(--ink-2);font-size:14.5px}
.vrow .fm{font-weight:700;font-size:18px}
.vrow .pr{font-size:14px;color:var(--accent-ink)}
.vrow .de{color:var(--ink-2);font-size:14.5px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:99px;padding:4px}
.seg button{padding:8px 18px;border-radius:99px;font-size:14.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar-row{display:flex;justify-content:center;gap:14px;align-items:center;margin:0 0 16px}
.vtab{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:600;font-size:16px;transition:background .15s,transform .12s,opacity .15s;min-width:140px}
.btn:hover:not(:disabled){background:var(--accent-ink)}
.btn:disabled{opacity:.4}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#3F664A}
.btn.bad{background:var(--bad)}
.btn.bad:hover{background:#933830}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font-weight:500;transition:background .15s}
.btn-ghost:hover{background:var(--surface-3)}
.verb-meta{text-align:center;margin:-14px 0 22px;color:var(--ink-2)}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--gold-soft);color:#8A6418;margin-left:6px;vertical-align:middle}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.fc{width:620px;max-width:100%;height:340px;perspective:1600px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
.fc-face.fc-back{transform:rotateY(180deg);background:linear-gradient(170deg,#FFFDF9,#FBF1EA)}
.fc-face .big{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.15}
.fc-face .big.long{font-size:28px}
.fc-face .pr{color:var(--accent-ink);font-size:17px}
.fc-face .pl{color:var(--ink-3);font-size:14px}
.fc-face .flip-hint{position:absolute;bottom:16px;font-size:12.5px;color:var(--ink-3)}
.fc-nav{display:flex;align-items:center;gap:16px}
.fc-count{min-width:90px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Exercise */
.ex-head{display:grid;grid-template-columns:140px 1fr 260px;align-items:center;gap:20px;margin:2px 0 22px;min-height:46px;padding-right:56px}
.ex-head .pbar{height:12px}
.ex-count{justify-self:end;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:15px}
.ex-grid{display:grid;grid-template-columns:1fr 1.12fr;gap:26px;height:calc(100vh - 128px);min-height:500px;max-height:660px}
.q-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:34px 34px 30px;overflow:hidden}
.q-kick{position:absolute;top:22px;left:0;right:0;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.badge-new{position:absolute;top:18px;right:20px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#8A6418;background:var(--gold-soft);padding:4px 10px;border-radius:99px}
.q-main{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.q-main.m{font-size:32px}
.q-main.s{font-size:25px;line-height:1.3}
.q-main.de{color:var(--ink)}
.q-pron{font-size:18px;color:var(--accent-ink);letter-spacing:.3px;line-height:1.4;max-width:100%}
.q-pron.s{font-size:15px}
.q-sub{font-size:14px;color:var(--ink-3)}
.q-hidden{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:14.5px;padding:12px 18px;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 18px;border-radius:var(--r-sm);background:var(--surface-2);max-width:100%}
.reveal .es{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.25}
.reveal .es.s{font-size:21px}
.reveal .pr{font-size:15px;color:var(--accent-ink)}
.tips{display:flex;flex-direction:column;gap:6px;margin-top:4px;max-width:440px}
.tip{font-size:13.5px;color:var(--ink-2);background:var(--gold-soft);border-radius:var(--r-xs);padding:7px 12px;text-align:left}
.tip b{color:#7A5714}
.a-panel{display:flex;flex-direction:column;min-height:0}
.a-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;padding:15px 18px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;font-size:17.5px;transition:border-color .15s,transform .12s,background .15s;min-height:62px}
.opt:hover:not(:disabled){border-color:#E4C9BD;transform:translateX(2px)}
.opt .key{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--ink-3);background:var(--surface-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .key{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.es-opt .opt-t{font-weight:600}
.fb{height:104px;flex:none;margin-top:16px;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px;background:var(--surface-2);transition:background .2s}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb-msg{font-size:15.5px;line-height:1.35;min-width:0}
.fb-msg b{display:block;font-size:19px;margin-bottom:2px}
.fb-msg .alt{display:block;font-size:13.5px;margin-top:4px;color:var(--ink-2)}
.fb.ok .fb-msg b{color:var(--ok)}
.fb.bad .fb-msg b{color:var(--bad)}
.fb-msg .sol{font-weight:600}
.fb-btns{display:flex;gap:10px;flex:none}
.fb .btn-ghost{background:rgba(255,255,255,.75)}
.fb .btn-ghost:hover{background:#fff}

/* Build */
.typebox input{width:100%;font:inherit;font-size:24px;padding:18px 20px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:none}
.typebox input:focus{border-color:var(--accent)}
.typebox.ok input{border-color:var(--ok);background:var(--ok-soft)}
.typebox.bad input{border-color:var(--bad);background:var(--bad-soft)}
.q-sec{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:99px}
.report{font-size:12.5px;color:var(--ink-2);padding:6px 10px;border-radius:99px;background:var(--surface-2);margin-right:12px}
.report:hover{background:var(--surface-3);color:var(--ink)}
#levelup{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(30,22,18,.55);animation:luFade .25s ease-out}
#levelup .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#levelup .confetti i{position:absolute;top:-24px;border-radius:2px;animation-name:luFall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
#levelup .lu-card{position:relative;background:linear-gradient(135deg,#2E2622,#4A2F28);color:#F6EDE4;border-radius:22px;padding:36px 44px 30px;text-align:center;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:luPop .45s cubic-bezier(.2,1.4,.4,1)}
#levelup .lu-em{font-size:64px;line-height:1}
#levelup .lu-kicker{margin-top:10px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#E7B04A}
#levelup h2{margin:6px 0 10px;font-size:28px;color:#FFF6EC}
#levelup p{margin:0 0 22px;color:#D9C8B8;line-height:1.45}
#levelup .btns{display:flex;gap:12px;justify-content:center}
#levelup .btn-ghost{background:rgba(255,255,255,.12);color:#F6EDE4}
@keyframes luFall{to{top:105%;transform:rotate(720deg)}}
@keyframes luPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes luFade{from{opacity:0}to{opacity:1}}
.tile.hardtile.locked{background:linear-gradient(135deg,#5A514C,#6E5E57);opacity:.95}
.tile.hardtile .hm-open{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.5px;vertical-align:middle;margin-left:8px;padding:3px 9px;border-radius:99px;background:#E7B04A;color:#2E2622}

.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:15px}

.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:17px;transition:transform .15s,opacity .15s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn.sm{width:30px;height:30px;font-size:13px;box-shadow:none;background:var(--surface-2)}
.iconbtn.audio.off{opacity:.45;filter:grayscale(1)}
.today{position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 16px}
.today .btn-hero{padding:10px 18px;font-size:16px;gap:10px;box-shadow:0 4px 12px rgba(181,82,59,.22)}
.today .btn-hero .cnt{font-size:13px;padding:3px 9px}
.today .toggle.audio{align-self:stretch;gap:10px;padding:0 14px;font-size:14px}
.today .toggle.audio .switch{width:40px;height:23px}
.today .toggle.audio .switch::after{width:17px;height:17px}
.today .toggle.audio .switch.on::after{transform:translateX(17px)}
.goalline{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--surface-3);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.goalline i{display:block;height:100%;background:var(--ok);border-radius:0 99px 99px 0;transition:width .4s}
.page.home .hint{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:10px;color:var(--accent-ink);background:var(--accent-soft);display:inline-block}
.grp{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:22px 4px 8px}
.head+.grp{margin-top:0}
.mgrid{display:grid;gap:10px}
.mgrid.c2{grid-template-columns:repeat(2,1fr)} .mgrid.c3{grid-template-columns:repeat(3,1fr)} .mgrid.c4{grid-template-columns:repeat(4,1fr)} .mgrid.c5{grid-template-columns:repeat(5,1fr)}
@media (max-width:820px){.mgrid.c4,.mgrid.c5{grid-template-columns:repeat(3,1fr)} .legend{grid-template-columns:1fr}}
@media (max-width:600px){.mgrid.c3,.mgrid.c4,.mgrid.c5{grid-template-columns:repeat(2,1fr)}}
.mt{display:flex;align-items:center;gap:11px;padding:11px 14px;min-height:58px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink);transition:transform .15s,box-shadow .15s}
.mt:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.mt:disabled{opacity:.5;cursor:default}
.mt-em{font-size:22px;flex:none;width:28px;text-align:center;line-height:1}
.mt-em:empty{display:none}
.mt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mt-tt{font-weight:600;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto}
.mt-sub{font-size:12.5px;color:var(--ink-3);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-meta{display:flex;align-items:center;gap:7px}
.mt-bar{display:block;flex:none;width:38px;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.mt-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mt-pct{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.mt-side{flex:none;font-size:12.5px;color:var(--ink-3)}
.mt.lg{min-height:64px;padding:12px 13px;gap:10px;border-radius:16px}
.mt.lg .mt-em{font-size:25px;width:30px}
.mt.lg .mt-tt{font-family:var(--serif);font-size:16.5px;white-space:nowrap}
.mt .lv-next{font-size:14px;letter-spacing:2px;color:inherit}
.mt.lg .mt-sub{margin-top:-2px}
.mt.lg .mt-pct{font-size:12px}
.mt.verb .mt-tt{font-family:var(--serif);font-size:18px}
.mt.dark{background:linear-gradient(135deg,#2E2622,#4A2F28);color:#FFF6EC}
.mt.dark.locked{background:linear-gradient(135deg,#5A514C,#6E5E57)}
.mt.dark .mt-pct,.mt.teal .mt-pct,.mt.dark .mt-side,.mt.teal .mt-side{color:#E3D6CA}
.mt.dark .mt-bar{background:rgba(255,255,255,.18)} .mt.dark .mt-bar i{background:#E7B04A}
.mt.teal{background:linear-gradient(135deg,#1F4A55,#2D6A6E);color:#fff}
.mt.teal .mt-side{font-size:16px;letter-spacing:1px}
.mt .hm-open{font-family:var(--sans);font-size:11px;font-weight:700;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:99px;background:#E7B04A;color:#2E2622}
.mt .lock{font-size:14px;margin-left:4px}
.mt .badge{display:inline-block;min-width:24px;text-align:center;font-size:12.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:2px 8px}
.mt.special{background:var(--accent-soft)}
.mt.hardsub{box-shadow:inset 3px 0 0 #4A2F28,var(--shadow)}
.mt.lvsub{box-shadow:inset 3px 0 0 #2D6A6E,var(--shadow)}
.statusline{display:flex;align-items:center;gap:14px;justify-content:center;margin:-12px 0 18px;font-size:13.5px;color:var(--ink-2)}
.statusline .mt-bar{width:60px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;padding:16px 20px;border-radius:16px;font-size:13px;color:var(--ink-2);line-height:1.35}
.lg-i{display:flex;align-items:center;gap:10px;min-width:0}
.lg-i b{color:var(--ink);font-weight:600;margin-right:3px}
.lg-em{flex:none;width:24px;text-align:center;font-size:16px;display:flex;justify-content:center}
.lg-em .mt-bar{width:22px}
.page.login{min-height:100vh;display:grid;place-items:center;padding-top:0}
.login-card{width:340px;max-width:100%;padding:30px 28px 22px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.login-card .mark{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.2px;margin:2px 0 10px}
.login-card .mark em{font-style:normal;color:var(--accent)}
.lg-flag{width:52px;height:52px;border-radius:14px;margin:0 auto;background:linear-gradient(#AA151B 0 25%,#F1BF00 25% 75%,#AA151B 75%);box-shadow:var(--shadow)}
.login-card input,.pwform input{font:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--surface-3);background:var(--surface-2);color:var(--ink);outline:none}
.login-card input:focus,.pwform input:focus{border-color:var(--accent);background:var(--surface)}
.login-card .btn-hero{padding:12px 18px;font-size:16px;margin-top:4px}
.login-card .btn-hero:disabled{opacity:.6}
.li-msg{font-size:13px;color:var(--ink-2);line-height:1.35}
.li-msg.err{color:var(--accent-ink)}
.li-wait{color:var(--ink-3);font-size:22px}
.pwform{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.pill.on{background:var(--ink);color:#fff}
.pill.dark{background:var(--accent);color:#fff}
.lv-simple{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 24px}
.lv-themes{justify-content:center}
.lv-simple .lv-go{width:min(360px,100%);padding:13px 20px;font-size:17px}
.lv-roomlink{font-size:13px}
.lv-room1{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lv-room1 input{font:inherit;font-size:15px;width:120px;padding:9px 12px;border-radius:12px;border:1px solid var(--surface-3);background:var(--surface-2);text-transform:uppercase}
.lv-simple .lv-lobby{display:flex;flex-direction:column;align-items:center;gap:10px}
.rankchip{cursor:pointer}
.rk-list{max-width:560px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column}
.rk-row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:12px}
.rk-row + .rk-row{border-top:1px solid var(--surface-3)}
.rk-row.me{background:var(--surface-2)}
.rk-m{width:30px;text-align:center;font-size:22px}
.rk-n{font-size:15px;color:var(--ink-3);font-weight:600}
.rk-name{flex:1;font-size:16px;font-weight:600}
.rk-bar{width:120px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--gold, #E2A93B);border-radius:99px}
.rk-xp{width:76px;text-align:right;font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rk-xp b{color:var(--ink);font-size:16px}
.page.home .stand{margin-top:26px;font-size:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(30,22,18,.35);z-index:50;animation:luFade .2s}
.sheet{position:fixed;top:84px;right:max(24px,calc(50% - 380px));width:380px;z-index:51;padding:18px 20px;display:flex;flex-direction:column;gap:14px;animation:luPop .25s cubic-bezier(.2,1.2,.4,1)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;font-size:17px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px}
.spills,.sbtns{display:flex;gap:6px;align-items:center}
.toggle.bare{background:none;padding:0}
[data-tip]{position:relative}
[data-tip].tip-below:hover::after{bottom:auto;top:calc(100% + 8px)}
.topbar{position:relative;z-index:30}
.topbar [data-tip]:hover::after{bottom:auto;top:calc(100% + 8px)}
.topbar .tb-r > :last-child:hover::after{left:auto;right:0;transform:none}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#2E2622;color:#FFF6EC;font:500 12.5px/1.35 var(--sans);letter-spacing:0;text-transform:none;padding:7px 10px;border-radius:9px;white-space:normal;width:max-content;max-width:260px;text-align:center;z-index:60;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:tipIn .15s .35s both}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,3px)}to{opacity:1;transform:translate(-50%,0)}}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stand{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-3)}
.lsec{padding:14px 22px 8px;font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent-ink);background:var(--surface-2)}
.src a{color:var(--accent-ink)}
.slots{min-height:150px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 57px,var(--line) 57px,var(--line) 58px);background-position:0 8px}
.slots.ok{outline:2px solid var(--ok)}
.slots.bad{outline:2px solid var(--bad)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.chip{padding:11px 16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-size:17.5px;font-weight:500;transition:transform .1s,background .15s;min-width:46px}
.chip:hover:not(:disabled){transform:translateY(-1px);border-color:#DCC4B6}
.chip.used{visibility:visible;color:transparent;background:var(--surface-3);border-color:var(--surface-3);box-shadow:none;pointer-events:none}
.chip.letter{min-width:50px;font-size:21px;font-weight:600;text-align:center;padding:10px 0}
.slots .chip{box-shadow:0 2px 0 var(--line)}

/* Pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.pcol{display:flex;flex-direction:column;gap:12px}
.pchip{padding:16px 16px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;font-size:17px;text-align:center;min-height:62px;transition:all .15s}
.pchip.es{font-weight:600}
.pchip:hover:not(:disabled){border-color:#E4C9BD}
.pchip.sel{border-color:var(--accent);background:var(--accent-soft)}
.pchip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);opacity:.6;box-shadow:none;pointer-events:none}
.pchip.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Summary */
.sum{padding:40px 36px;text-align:center}
.sum .em{font-size:56px}
.sum h2{font-family:var(--serif);font-size:30px;margin:10px 0 6px}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}
.sum-stats>div{background:var(--surface-2);border-radius:var(--r-sm);padding:18px}
.sum-stats .n{font-family:var(--serif);font-size:28px;font-weight:600}
.sum-stats .l{font-size:13px;color:var(--ink-2)}
.sum .btns{display:flex;justify-content:center;gap:14px}

.settings{margin-top:40px;display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.pill{padding:6px 12px;border-radius:99px;background:var(--surface-3);font-size:13.5px}
.linkbtn{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.linkbtn.danger{color:var(--bad)}
.section-label{text-align:center;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:34px 0 0}
</style>

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

/* ================= WIEDERHOLUNGSSYSTEM (Leitner, 5 Boxen) ================= */
const INTERVALS = [1, 3, 7, 16, 35];
function P(id){ return PROG[id] || { b: 0, d: 0, s: 0, c: 0, w: 0 }; }
function record(item, ok){
  const p = Object.assign({}, P(item.id)); const t = today();
  p.s++;
  if (ok){ p.c++; p.b = Math.min(5, p.b + 1); p.d = t + INTERVALS[p.b - 1]; }
  else { p.w++; p.b = p.b > 0 ? 1 : 0; p.d = t + (p.b > 0 ? 1 : 0); }
  PROG[item.id] = p; save(KEYS.prog, PROG);
  return p;
}
function isDue(item, t){ const p = P(item.id); return p.b >= 1 && p.d <= t; }
function dueItems(){ const t = today(); return ITEMS.filter(i => !isHard(i) && isDue(i, t)).sort((a, b) => (P(a.id).d - P(b.id).d) || (P(a.id).b - P(b.id).b)); }
function mastery(items){ if (!items.length) return 0; let s = 0; items.forEach(i => s += P(i.id).b); return Math.round(s / (5 * items.length) * 100); }

/* ================= XP / STREAK / TAGESZIEL ================= */
function normalizeDay(){
  const t = today(); let changed = false;
  if (STATS.xpDay !== t){ STATS.xpDay = t; STATS.xpToday = 0; changed = true; }
  if (STATS.lastGoalDay != null && STATS.lastGoalDay < t - 1 && STATS.streak !== 0){ STATS.streak = 0; changed = true; }
  if (changed) save(KEYS.stats, STATS);
}
function weekKey(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return t.getUTCFullYear() + "-W" + String(Math.ceil(((t - y0) / 864e5 + 1) / 7)).padStart(2, "0"); }
function weekXp(){ return STATS.wk === weekKey(clock()) ? (STATS.wkXp || 0) : 0; }
function addXp(n){
  normalizeDay(); const t = today();
  STATS.xpToday += n; STATS.totalXp += n;
  const wk = weekKey(clock()); if (STATS.wk !== wk){ STATS.wk = wk; STATS.wkXp = 0; } STATS.wkXp += n;
  let reached = false;
  if (STATS.xpToday >= SETTINGS.goal && STATS.lastGoalDay !== t){
    STATS.streak = (STATS.lastGoalDay === t - 1) ? STATS.streak + 1 : 1;
    STATS.lastGoalDay = t; STATS.best = Math.max(STATS.best, STATS.streak); reached = true;
  }
  save(KEYS.stats, STATS); return reached;
}

/* ================= SPRACHAUSGABE ================= */
let esVoice = null, voicesKnown = false;
const HAS_TTS = typeof window !== "undefined" && "speechSynthesis" in window;
function pickVoice(){
  if (!HAS_TTS) return;
  const vs = speechSynthesis.getVoices() || [];
  voicesKnown = vs.length > 0;
  const norm = v => (v.lang || "").replace("_", "-").toLowerCase();
  const spain = vs.filter(v => norm(v) === "es-es");
  const anyEs = vs.filter(v => /^es(-|$)/.test(norm(v)));
  const rank = v => (/google/i.test(v.name) ? 0 : /m[oó]nica|jorge|lucia|lucía|alvaro|álvaro|elvira|helena|laura|pablo/i.test(v.name) ? 1 : 2);
  const pool = spain.length ? spain : anyEs;
  esVoice = pool.slice().sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (HAS_TTS){ pickVoice(); speechSynthesis.onvoiceschanged = () => { const had = !!esVoice; pickVoice(); if (had !== !!esVoice && VIEW.name === "home") render(); }; }
function voiceOK(){ return HAS_TTS && !!esVoice; }
function speak(text, slow){
  if (!HAS_TTS || !text) return;
  if (!esVoice){ pickVoice(); }
  if (!esVoice && voicesKnown) return;           // keine spanische Stimme -> nichts Falsches vorlesen
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = esVoice ? esVoice.lang.replace("_", "-") : "es-ES";
    if (esVoice) u.voice = esVoice;
    u.rate = slow ? 0.62 : 0.9; u.pitch = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= ÜBUNGSLOGIK ================= */
function distractorPool(item){
  let pool = (CAT_ITEMS[item.cat] || []).filter(o => o.id !== item.id && o.es !== item.es && o.de !== item.de);
  return pool;
}
function mcOptions(item, field){
  const pool = shuffle(distractorPool(item));
  const seen = new Set([item[field]]); const ds = [];
  for (const o of pool){ if (!seen.has(o[field])){ seen.add(o[field]); ds.push(o); } if (ds.length === 3) break; }
  const opts = shuffle([item].concat(ds)).map(o => ({ id: o.id, text: o[field] }));
  return { opts, correct: opts.findIndex(o => o.id === item.id) };
}
function canBuildWord(item){ return item.kind === "w" && item.single && item.es.length >= 3 && item.es.length <= 11; }
function canBuildSentence(item){ return item.kind === "s" && item.toks.length >= 3; }
function canType(item){ return item.kind !== "s" || item.toks.length <= 6; }
const normT = s => String(s).toLowerCase().replace(/[¿?¡!.,;:"«»]/g, " ").replace(/\s+/g, " ").trim();
const stripAcc = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function typeAnswers(item){
  if (item.kind === "v") return [item.form].concat(item.pronouns.map(p => p + " " + item.form));
  return [item.es].concat(item.alts || []);
}
function typeCheck(item, input){
  const got = normT(input); if (!got) return "wrong";
  const cands = typeAnswers(item).map(normT);
  if (cands.includes(got)) return "exact";
  if (cands.map(stripAcc).includes(stripAcc(got))) return "accent";
  return "wrong";
}
function chooseType(item, lastType){
  const p = P(item.id); const seen = p.s > 0;
  if (!seen) return "mc_t2n";                                     // Neues erst zeigen: Spanisch -> Bedeutung
  const types = ["mc_t2n", "mc_n2t"];
  if (canBuildSentence(item)) types.push("build_s", "build_s");
  if (canType(item)) types.push("type");
  if (seen && canBuildWord(item)) types.push("build_w");
  if (seen && SETTINGS.audio && voiceOK()) types.push("listen");
  const pool = types.filter(t => t !== lastType);
  return pick(pool.length ? pool : types);
}
function makeExercise(entry, lastType){
  const item = entry.item;
  const type = entry.forceType || chooseType(item, lastType);
  const ex = { type, item, retry: !!entry.retry, isNew: P(item.id).s === 0, answered: false, ok: null };
  if (type === "mc_t2n" || type === "listen"){ Object.assign(ex, mcOptions(item, "de")); }
  else if (type === "mc_n2t"){ Object.assign(ex, mcOptions(item, "es")); }
  else if (type === "type"){ ex.typed = ""; ex.result = null; }
  else if (type === "build_s"){
    const own = new Set(item.toks);
    const extra = shuffle([].concat(...(CAT_ITEMS[item.cat] || []).filter(o => o.id !== item.id).map(o => o.toks)).filter(t => !own.has(t)));
    const ext = [...new Set(extra)].slice(0, 2);
    ex.target = item.toks.slice();
    ex.targets = [item.toks].concat((item.alts || []).map(tokens));     // weitere richtige Lösungen
    const altOnly = [...new Set([].concat(...ex.targets.slice(1)).filter(t => !own.has(t)))];
    ex.bank = shuffle(item.toks.concat(altOnly, ext.filter(t => !altOnly.includes(t)))).map(t => ({ t, used: false }));
    ex.placed = [];
  }
  else if (type === "build_w"){
    const letters = [...item.es.toLowerCase()];
    let sh = shuffle(letters), guard = 0;
    while (sh.join("") === letters.join("") && guard++ < 20) sh = shuffle(letters);
    ex.target = letters; ex.bank = sh.map(t => ({ t, used: false })); ex.placed = [];
  }
  return ex;
}
function buildCheck(ex){ const got = ex.placed.map(i => ex.bank[i].t); return (ex.targets || [ex.target]).some(tg => got.length === tg.length && got.every((t, i) => t === tg[i])); }
function pairsPool(catId, requireSeen){
  const items = (CAT_ITEMS[catId] || []).filter(i => !requireSeen || P(i.id).s > 0);
  const out = [], es = new Set(), de = new Set();
  for (const i of shuffle(items)){ if (!es.has(i.es) && !de.has(i.de)){ es.add(i.es); de.add(i.de); out.push(i); } if (out.length === 4) break; }
  return out;
}
function makePairs(catHint, requireSeen){
  let items = catHint ? pairsPool(catHint, requireSeen) : [];
  if (items.length < 4){
    const cats = shuffle(Object.keys(CAT_ITEMS));
    for (const c of cats){ const p = pairsPool(c, requireSeen); if (p.length === 4){ items = p; break; } }
  }
  if (items.length < 4) return null;
  return { type: "pairs", items, left: shuffle(items).map(i => ({ id: i.id, text: i.es })), right: shuffle(items).map(i => ({ id: i.id, text: i.de })),
           selL: null, selR: null, done: [], mist: [], flash: null, answered: false, ok: null };
}
function pairsChoose(ex, side, id){
  if (ex.answered || ex.done.includes(id)) return null;
  if (side === "L"){ ex.selL = id; } else { ex.selR = id; }
  if (ex.selL && ex.selR){
    const L = ex.selL, R = ex.selR; ex.selL = ex.selR = null;
    if (L === R){ ex.done.push(L); if (ex.done.length === ex.items.length){ ex.answered = true; ex.ok = ex.mist.length === 0; } return { match: true, id: L }; }
    if (!ex.mist.includes(L)) ex.mist.push(L);
    if (!ex.mist.includes(R)) ex.mist.push(R);
    ex.flash = { L, R }; return { match: false };
  }
  return null;
}

/* ---- Tagesübung zusammenstellen ---- */
function newCandidates(kindItems, groupKey){
  const groups = []; const map = {};
  kindItems.forEach(i => { const g = groupKey(i); if (!map[g]){ map[g] = []; groups.push(map[g]); } map[g].push(i); });
  const out = [];
  groups.forEach(g => { const fresh = g.filter(i => P(i.id).b === 0); fresh.sort((a, b) => (P(b.id).s > 0) - (P(a.id).s > 0)); out.push(...fresh); });
  return out;
}
function pickNew(limit){
  const w = newCandidates(WORD_ITEMS, i => i.cat), v = newCandidates(VERB_ITEMS, i => i.cat), s = newCandidates(SENT_ITEMS.filter(i => !isHard(i)), i => i.cat);
  const pattern = ["w", "w", "v", "w", "s"]; const src = { w, v, s }; const out = []; let k = 0, guard = 0;
  while (out.length < limit && (w.length || v.length || s.length) && guard++ < 200){
    const kind = pattern[k++ % pattern.length];
    if (src[kind].length) out.push(src[kind].shift());
  }
  return out;
}
function dailyCount(){ return dueItems().length; }
function buildDailyQueue(){
  const due = dueItems().slice(0, 12);
  const newLimit = due.length >= 10 ? 3 : due.length >= 5 ? 5 : 8;
  const fresh = pickNew(newLimit);
  let items = [];
  const d = shuffle(due), f = fresh.slice();
  while (d.length || f.length){ if (d.length) items.push(d.shift()); if (d.length && items.length % 3 === 2) items.push(d.shift()); if (f.length) items.push(f.shift()); }
  items = items.slice(0, 15);
  if (!items.length){
    const seen = ITEMS.filter(i => !isHard(i) && P(i.id).s > 0).sort((a, b) => P(a.id).b - P(b.id).b);
    items = shuffle(seen.slice(0, 30)).slice(0, 10);
  }
  return withPairSlots(items.map(item => ({ item })));
}
function withPairSlots(entries){
  const out = [];
  entries.forEach((e, i) => { out.push(e); if ((i + 1) % 5 === 0 && i + 1 < entries.length) out.push({ pairs: true }); });
  if (entries.length >= 5) out.push({ pairs: true });
  return out;
}
function buildQuizQueue(kind, id){
  let items;
  if (kind === "all") items = shuffle(WORD_ITEMS).slice(0, 15);
  else if (kind === "big") items = shuffle(WORD_ITEMS.concat(VERB_ITEMS)).slice(0, 20);
  else if (kind === "hard") items = shuffle(hardItems().slice(0, 15));
  else if (kind === "hardall") items = shuffle(HARD_ITEMS).slice(0, 15);
  else if (kind === "verb") items = shuffle(CAT_ITEMS[id] || []);
  else items = shuffle(CAT_ITEMS[id] || []).slice(0, 10);
  return withPairSlots(items.map(item => ({ item })));
}

function hardItems(){
  const score = i => { const p = P(i.id); return p.w / (p.c + 1) + (5 - p.b) * 0.1; };
  return ITEMS.filter(i => P(i.id).w > 0).sort((a, b) => score(b) - score(a));
}
function verbQuizTitle(cat){ const [, id, t] = cat.split(":"); const v = VERBS.find(x => x.id === id); return "Quiz: " + v.inf + " · " + TENSE_NAMES[t || "pres"]; }

let SESSION = null;
function startSession(mode, queue, title){
  SESSION = { mode, title, queue, idx: 0, doneIds: new Set(), ex: null, lastType: null, correct: 0, wrong: 0, xp: 0, goalHit: false, answeredCount: 0, retried: new Set(), lastCat: null };
  STACK.push(VIEW); VIEW = { name: "session", params: {} }; nextExercise(true); window.scrollTo(0, 0);
}
function nextExercise(first){
  const S = SESSION; if (!first) S.idx++;
  while (S.idx < S.queue.length){
    const e = S.queue[S.idx];
    if (e.pairs){
      const px = makePairs(S.lastCat, S.mode === "daily");
      if (px){ S.ex = px; break; }
      S.queue.splice(S.idx, 1); continue;
    }
    S.ex = makeExercise(e, S.lastType); S.lastType = S.ex.type; S.lastCat = e.item.cat; break;
  }
  if (S.idx >= S.queue.length){ VIEW = { name: "summary", params: {} }; render(); return; }
  render();
  const ex = S.ex;
  if (SETTINGS.audio && (ex.type === "listen" || ex.type === "mc_t2n")) setTimeout(() => speak(ex.item.say), 250);
  if (ex.type === "type"){ const inp = document.getElementById("typein"); if (inp) inp.focus(); }
}
function finishAnswer(ok){
  const S = SESSION, ex = S.ex;
  ex.answered = true; ex.ok = ok; S.answeredCount++;
  if (ex.type === "pairs"){
    ex.items.forEach(i => { if (P(i.id).s > 0 && !S.doneIds.has(i.id)){ record(i, !ex.mist.includes(i.id)); S.doneIds.add(i.id); } });
    if (ok) S.correct++; else S.wrong++;
    const g = ok ? 10 : 5; S.xp += g; if (addXp(g)) S.goalHit = true;
  } else {
    if (!ex.retry){ record(ex.item, ok); S.doneIds.add(ex.item.id); }
    if (ok){ S.correct++; const g = ex.retry ? 5 : 10; S.xp += g; if (addXp(g)) S.goalHit = true; }
    else { S.wrong++; if (!ex.retry && !S.retried.has(ex.item.id)){ S.retried.add(ex.item.id); S.queue.push({ item: ex.item, retry: true }); } }
    if (SETTINGS.audio) setTimeout(() => speak(ex.item.say), 120);
  }
  render();
}
const PRAISE = ["Richtig!", "Sehr gut!", "Genau!", "Perfekt!", "¡Muy bien!"];
function vSession(){
  const S = SESSION, ex = S.ex; const total = S.queue.length; const pct = Math.round(S.idx / total * 100);
  let left = "", right = "", fb = "";
  const it = ex.item; const isS = it && (it.kind === "s" || it.es.length > 22);

/* ================= 🎙️ LIVE SESSION ================= */
const LIVE_THEMES = [["mix", "🎲 Gemischt"], ["viaje", "✈️ Reisen & Flughafen"], ["resto", "🍷 Restaurant & Bar"], ["piso", "🏠 Wohnung & Vermieter"], ["salud", "🩺 Arzt & Apotheke"]];
const LIVE_TASKS = {
  roulette: { em: "🎡", name: "Verb-Roulette", sub: "Verb, Zeitform und Person – alle konjugieren laut" },
  puzzle:   { em: "🧩", name: "Satz-Puzzle", sub: "Einen Satz aus Bausteinen zusammensetzen" },
  story:    { em: "📖", name: "Erzählkette", sub: "Reihum erzählen – früher (Imperfecto) und dann (Indefinido)" },
  role:     { em: "🎭", name: "Rollenspiel-Karten", sub: "Geheimes Ziel gegen Hindernis, mit höflichen Formen" },
  whatif:   { em: "🤔", name: "¿Qué harías si…?", sub: "Was wäre, wenn … – mit si tuviera und der würde-Form" },
  errors:   { em: "🔍", name: "Fehlerjagd", sub: "Versteckte Fehler gegen die Uhr finden" } };
const MAIN_ORDER = ["story", "role", "whatif", "errors"];
const LIVE_PAIRS = []; MAIN_ORDER.forEach(a => MAIN_ORDER.forEach(b => { if (a !== b) LIVE_PAIRS.push([a, b]); }));
const LIVE_MODES = [["solo", "👤 Allein"], ["screen", "🖥️ Bildschirm teilen"], ["room", "🔑 Raum-Code"]];
const HELP_CARDS = 2;          // so viele Karten pro Aufgabe zeigen eine Hilfe
const ROULETTE_TENSES = { 1: ["pres"], 2: ["past", "perf", "fut"], 3: ["impf", "prog", "past"] };
const ROULETTE_TNAME = { pres: "Präsens", past: "Indefinido", perf: "Perfekt", fut: "Zukunft (ir a)", impf: "Imperfecto", prog: "Verlaufsform" };
const ROULETTE_TSUB = { pres: "Gegenwart", past: "einfache Vergangenheit", perf: "he hablado …", fut: "voy a …", impf: "früher immer", prog: "gerade jetzt" };
const PERS_PRON = { yo: "JO", "tú": "TU", "él": "EL", ella: "E-ja", usted: "us-TED", nosotros: "no-SSO-tros", nosotras: "no-SSO-tras", vosotros: "bo-SSO-tros", vosotras: "bo-SSO-tras", ellos: "E-jos", ellas: "E-jas", ustedes: "us-TE-des" };
const ROULETTE_PERS = [["yo"], ["tú"], ["él", "ella", "usted"], ["nosotros", "nosotras"], ["vosotros", "vosotras"], ["ellos", "ellas", "ustedes"]];
const WHATIF_TIP = "Si + -ra-Form (tuviera, pudiera …), danach die würde-Form (iría, compraría …). Mehr dazu im 💎 Hard Mode unter „Si tuviera …“.";

let LR = null;            // laufende Live Session
let liveTimer = null, liveSpin = null;

function liveConf(){
  if (!SETTINGS.live) SETTINGS.live = {};
  const c = SETTINGS.live;
  c.mode = "screen";                               // Session = Gruppe; Einzeln üben = allein
  if (!LIVE_THEMES.some(t => t[0] === c.theme)) c.theme = "mix";
  c.level = 1;                                     // Startstufe fest 1, passt sich danach an
  if (typeof c.round !== "number") c.round = 0;
  const rot = [MAIN_ORDER[c.round % 4], MAIN_ORDER[(c.round + 1) % 4]];
  if (!MAIN_ORDER.includes(c.a) || c.autoRound !== c.round) { c.a = rot[0]; c.b = rot[1]; c.autoRound = c.round; }
  if (!MAIN_ORDER.includes(c.b) || c.b === c.a) c.b = MAIN_ORDER.find(x => x !== c.a);
  return c;
}
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rshuffle(a, rng){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rpick(a, rng){ return a[Math.floor(rng() * a.length)]; }

/* Raum-Code: SOL-#### enthält Thema, Startstufe, Aufgabenpaar und Kartenfolge */
function liveEncode(o){
  const th = LIVE_THEMES.findIndex(t => t[0] === o.theme);
  return "SOL-" + (1000 + (((o.seed * 12 + o.pair) * 3 + (o.level - 1)) * 5 + th));
}
function liveDecode(code){
  const d = String(code || "").replace(/\D/g, "");
  if (d.length !== 4) return null;
  let n = +d - 1000; if (n < 0 || n > 8999) return null;
  const th = n % 5; n = Math.floor(n / 5);
  const level = n % 3 + 1; n = Math.floor(n / 3);
  const pair = n % 12; const seed = Math.floor(n / 12);
  if (seed > 49) return null;
  return { theme: LIVE_THEMES[th][0], level, pair, seed, num: +d };
}
function liveNorm(s, keepAcc){
  let t = String(s || "").toLowerCase();
  if (!keepAcc) t = t.normalize("NFD").replace(/[̀-ͯ]/g, "");
  return t.replace(/[¿?¡!.,;:…"“”„]/g, " ").replace(/\s+/g, " ").trim();
}

/* ---------- Ablauf ---------- */
function liveSegments(kind, conf, single){
  if (single) return [{ task: single, n: 6, start: conf.level }];
  return [{ task: "puzzle", n: 4, start: conf.level, warm: true },
          { task: conf.a, n: 4, start: conf.level, label: "Hauptaufgabe 1 · leichter" }, { task: conf.b, n: 4, start: Math.min(3, conf.level + 1), label: "Hauptaufgabe 2 · schwerer" }];
}
function liveStart(o){
  // o: { mode, theme, level, a, b, single, code, joined }
  if (!o.single && (!o.a || !o.b)){ const c = liveConf(); o.a = o.a || c.a; o.b = o.b || c.b; }
  const segs = liveSegments(null, o, o.single).map(s => Object.assign(s, { level: s.start, streak: 0, k: 0, ok: 0, done: 0 }));
  const seedNum = o.code ? liveDecode(o.code).num : Math.floor(Math.random() * 1e9);
  LR = { mode: o.mode, theme: o.theme, level: o.level, segs, seg: 0, rng: mulberry32(seedNum * 2654435761 >>> 0), used: new Set(),
         code: o.code || null, joined: !!o.joined, single: o.single || null, role: "", card: null, total: segs.reduce((a, s) => a + s.n, 0), count: 0, finished: false };
  liveNextCard(true);
  STACK.push(VIEW); VIEW = { name: "liverun", params: {} }; render(); window.scrollTo(0, 0);
}
function liveSeg(){ return LR && LR.segs[LR.seg]; }
function liveLevelNow(seg){ return LR.mode === "room" ? Math.min(3, seg.start + Math.floor(seg.k / 2)) : seg.level; }
function liveNextCard(first){
  clearInterval(liveTimer); liveTimer = null;
  if (!first){ const s = liveSeg(); s.k++; LR.count++; if (s.k >= s.n) LR.seg++; }
  if (LR.seg >= LR.segs.length){ liveFinish(); return; }
  const seg = liveSeg(); const level = liveLevelNow(seg); const help = seg.k < HELP_CARDS;
  LR.card = liveMakeCard(seg.task, level, help);
}
function livePool(task, level){
  const all = LIVE[task] || [];
  const theme = LR.theme;
  const tests = [c => (theme === "mix" || c.theme === theme) && c.level === level,
                 c => (theme === "mix" || c.theme === theme) && Math.abs(c.level - level) === 1,
                 c => c.level === level, c => (theme === "mix" || c.theme === theme), () => true];
  for (const t of tests){ const p = all.filter(c => t(c) && !LR.used.has(c.id)); if (p.length) return p; }
  return all.slice();
}
function liveMakeCard(task, level, help){
  const rng = LR.rng; const base = { task, level, help, done: false, ok: null, inputs: {}, rate: null };
  if (task === "roulette"){
    const verbs = VERBS.slice().sort((a, b) => a.id < b.id ? -1 : 1);
    const tense = rpick(ROULETTE_TENSES[level], rng);
    // Verben ohne diese Zeitform (z. B. keine Verlaufsform bei ser, tener …) fallen weg
    const okV = verbs.filter(x => tense === "impf" || (x.tenses[tense] && x.tenses[tense].every(Boolean)));
    let v = rpick(okV, rng); for (let i = 0; i < 6 && LR.used.has("v:" + v.id); i++) v = rpick(okV, rng);
    LR.used.add("v:" + v.id);
    const p = Math.floor(rng() * 6); const who = rpick(ROULETTE_PERS[p], rng);
    let form, pr;
    if (tense === "impf"){ form = LIVE_IMPF[v.id][p][0]; pr = LIVE_IMPF[v.id][p][1]; }
    else { const f = v.tenses[tense][p]; form = f[1]; pr = f[2]; }
    return Object.assign(base, { verb: v, tense, who, form, pron: pr, spin: true });
  }
  const c = rpick(livePool(task, level), rng); LR.used.add(c.id);
  const card = Object.assign(base, { c });
  if (task === "puzzle"){
    const chunks = c.chunks.map(t => ({ t, used: false }));
    card.bank = rshuffle(chunks.concat((c.extra || []).map(t => ({ t, used: false }))), rng);
    card.placed = [];
    if (help){ const i = card.bank.findIndex(b => b.t === c.chunks[0]); card.bank[i].used = true; card.placed.push(i); card.fixed = 1; }
  } else if (task === "story"){
    card.gaps = []; card.parts = [];
    c.story.split(/(\{[^{}]+\})/).forEach(part => {
      const m = part.match(/^\{([^|]+)\|([^}]+)\}$/);
      if (m){ card.parts.push({ gap: card.gaps.length }); card.gaps.push({ right: m[1], opts: rshuffle([m[1], m[2]], rng), chosen: null }); }
      else if (part) card.parts.push({ text: part });
    });
  } else if (task === "role"){
    card.step = 0; card.mistakes = 0; card.log = [];
    card.opts = c.dialog.map(d => rshuffle(d[2].map((t, i) => ({ t, ok: i === 0 })), rng));
    card.typeLast = !help && LR.mode === "solo";
    card.show = { a: false, b: false };
  } else if (task === "whatif"){
    card.useChunks = help && !!c.chunks;
    if (card.useChunks){ card.bank = rshuffle(c.chunks.map(t => ({ t, used: false })), rng); card.placed = []; }
    card.inputs.answer = help ? c.start : "";
  } else if (task === "errors"){
    card.tokens = []; let ei = 0;
    c.text.split(/(\[[^\]]*\])/).forEach(part => {
      const m = part.match(/^\[([^|\]]+)\|([^\]]*)\]$/);
      if (m){ card.tokens.push({ w: m[1], err: true, right: m[2], i: ei++ }); return; }
      part.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) card.tokens.push({ sp: w }); else {
        const mm = w.match(/^([¿¡]*)(.*?)([.,;:?!]*)$/);
        if (mm[1]) card.tokens.push({ p: mm[1] }); if (mm[2]) card.tokens.push({ w: mm[2] }); if (mm[3]) card.tokens.push({ p: mm[3] }); } });
    });
    card.tokens.forEach((t, i) => t.id = i);
    card.sel = new Set(); card.t0 = null; card.left = c.time;
  }
  return card;
}
function liveResolve(ok){
  const card = LR.card, seg = liveSeg(); if (card.done) return;
  card.done = true; card.ok = ok; seg.done++;
  if (ok){ seg.ok++; seg.streak++; if (LR.mode !== "room" && seg.streak >= 2 && seg.level < 3){ seg.level++; seg.streak = 0; card.levelUp = true; } }
  else { seg.streak = 0; if (LR.mode !== "room" && seg.level > 1){ seg.level--; card.levelDown = true; } }
  clearInterval(liveTimer); liveTimer = null;
  render();
}
function liveFinish(){
  clearInterval(liveTimer); liveTimer = null;
  LR.finished = true; LR.card = null;
  const c = liveConf();
  if (!LR.single && !LR.joined){ c.round++; save(KEYS.settings, SETTINGS); }
  VIEW = { name: "livesum", params: {} }; render(); window.scrollTo(0, 0);
}

  const themes = LIVE_THEMES.map(([v, l]) => `<button class="pill ${c.theme === v ? "on" : ""}" data-act="liveSet" data-k="theme" data-v="${v}" data-tip="${esc(l)}">${short[v]}</button>`).join("");

/* ---------- Aktionen ---------- */
function liveCheckCard(){
  const card = LR.card; if (!card || card.done) return;
  const inp = document.getElementById("liveinput"); if (inp && inp.dataset.live) card.inputs[inp.dataset.live] = inp.value;
  if (card.task === "roulette"){
    let t = card.inputs.form || ""; if (!liveNorm(t)) { inp && inp.focus(); return; }
    const pron = ROULETTE_PERS.flat(); let words = liveNorm(t, true).split(" ");
    if (words.length > 1 && pron.includes(words[0])) words = words.slice(1);
    const got = words.join(" "), want = liveNorm(card.form, true);
    card.revealed = true;
    if (got === want) liveResolve(true);
    else if (liveNorm(got) === liveNorm(want)){ card.accentHint = true; liveResolve(true); }
    else liveResolve(false);
  } else if (card.task === "puzzle"){
    const got = card.placed.map(i => card.bank[i].t).join(" ");
    liveResolve(got === card.c.chunks.join(" "));
  } else if (card.task === "story"){
    if (!card.gaps.every(g => g.chosen)) return;
    card.checked = true; card.revealed = true;
    const noun = card.c.word.split(" ").pop().toLowerCase();
    card.wordMissing = !liveNorm(card.inputs.ending).includes(liveNorm(noun));
    render();
  } else if (card.task === "role"){
    if (card.typeLast && card.step === card.c.dialog.length - 1){ if (!liveNorm(card.inputs.reply)) { inp && inp.focus(); return; } card.typed = true; render(); }
  } else if (card.task === "whatif"){
    if (card.useChunks){
      const got = card.placed.map(i => card.bank[i].t).join(" ");
      liveResolve((card.c.answers || []).includes(got));
    } else {
      const a = liveNorm(card.inputs.answer);
      if (!a || a === liveNorm(card.c.start)) { inp && inp.focus(); return; }
      const raw = String(card.inputs.answer).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[¿?¡!.;:…]/g, " ");
      const m = raw.match(/\bsi\b([^,]*)(.*)/);
      const clause = m ? m[1] : "", rest = m ? m[2] : raw;
      const notes = [];
      if (/\b(tendria|seria|estaria|podria|haria|iria|querria|sabria)\b/.test(clause)) notes.push("Nach si steht nie die würde-Form: si tuviera, si fuera, si pudiera …");
      else if (m && !/\b\w+(ra|ras|ramos|rais|ran|se|ses|semos|seis|sen)\b/.test(clause)) notes.push("Nach si kommt die -ra-Form: si tuviera, si pudiera, si ganara …");
      if (!/\w(ia|ias|iamos|iais|ian)\b/.test(m ? rest : raw)) notes.push("Denk an die würde-Form mit -ía: iría, compraría, viviría …");
      card.notes = notes; card.checked = true; card.revealed = true; render();
    }
  } else if (card.task === "errors"){
    card.checked = true;
    const errs = card.tokens.filter(t => t.err);
    const found = errs.filter(t => card.sel.has(t.id)).length;
    const wrongSel = [...card.sel].filter(id => !card.tokens[id].err).length;
    liveResolve(found === errs.length && wrongSel <= 1);
  }
}
function livePlaceChip(el){
  const card = LR.card; if (card.done) return;
  if (el.dataset.from === "bank"){ const i = +el.dataset.i; if (card.bank[i].used) return; card.bank[i].used = true; card.placed.push(i); }
  else { const k = +el.dataset.k; if (k < (card.fixed || 0)) return; card.bank[card.placed[k]].used = false; card.placed.splice(k, 1); }
  render();
}
function liveRoleOpt(i){
  const card = LR.card, c = card.c; if (card.done || card.step >= c.dialog.length) return;
  const o = card.opts[card.step][i]; if (!o) return; const d = c.dialog[card.step];
  card.log.push({ npc: d[0], said: o.t, ok: o.ok, right: d[2][0] }); if (!o.ok) card.mistakes++;
  card.step++;
  if (card.step >= c.dialog.length) liveResolve(card.mistakes === 0); else render();

function liveAfterRender(){
  if (VIEW.name !== "liverun" || !LR || !LR.card){ clearInterval(liveTimer); liveTimer = null; return; }

    const finals = [card.verb.inf, ROULETTE_TNAME[card.tense], card.who];
    const t0 = Date.now(); const stops = [700, 1100, 1500];
    liveSpin = setInterval(() => {
      const t = Date.now() - t0;
      [0, 1, 2].forEach(i => { const el = document.getElementById("reel" + i); if (el) el.textContent = t >= stops[i] ? finals[i] : pools[i][Math.floor(Math.random() * pools[i].length)]; });

    }, 70);
  }
  if (card.task === "errors" && !card.checked){
    if (card.t0 === null) card.t0 = Date.now();

function liveKey(e){
  if (VIEW.name === "live" && e.key === "Enter" && document.activeElement && document.activeElement.id === "livecode"){ e.preventDefault(); LIVE_ACTIONS.liveJoin(); return true; }
  if (VIEW.name !== "liverun" || !LR || !LR.card) return false;

  if (e.key === "Enter"){

}
function backupDownload(){
  const data = { app: "Svenolingo", format: 1, stand: STAND, gesichert: new Date().toISOString(), progress: PROG, stats: STATS, settings: SETTINGS };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a"); const d = new Date();
  a.download = "svenolingo-fortschritt-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
  a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Fortschritt gesichert (" + Object.keys(PROG).length + " Einträge).");
}
function restoreFrom(text){
  let d; try { d = JSON.parse(text); } catch (e) { toast("Die Datei konnte nicht gelesen werden."); return false; }
  if (!d || d.app !== "Svenolingo" || typeof d.progress !== "object"){ toast("Das ist keine Svenolingo-Sicherung."); return false; }
  PROG = d.progress || {}; migrateProg(PROG);
  STATS = Object.assign(defaultStats(), d.stats || {});
  SETTINGS = Object.assign({ audio: true, goal: 150, goalV2: true }, d.settings || {});
  saveAll(); normalizeDay(); render();
  toast("Fortschritt geladen (" + Object.keys(PROG).length + " Einträge).");
  return true;
}
document.addEventListener("change", e => {
  if (e.target && e.target.id === "restorefile" && e.target.files && e.target.files[0]){
    const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(e.target.files[0]); e.target.value = "";
  }
});
let SESSION_LAST = null;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === "say") e.stopPropagation();
  fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (ONLINE && !CL.user){ if (e.key === "Enter"){ e.preventDefault(); ACTIONS.login(); } return; }
  if (VIEW.params && VIEW.params.pw && e.target && e.target.tagName === "INPUT"){ if (e.key === "Enter"){ e.preventDefault(); ACTIONS.pwSave(); } return; }
  if (document.getElementById("levelup")){ if (e.key === "Escape" || e.key === "Enter"){ e.preventDefault(); e.key === "Enter" ? ACTIONS.levelGo() : closeLevelUp(); } return; }
  if (VIEW.params && VIEW.params.sheet && e.key === "Escape"){ ACTIONS.sheetClose(); return; }
  if (liveKey(e)) return;
  if (VIEW.name === "session" && SESSION && SESSION.ex){
    const ex = SESSION.ex;
    if (e.key === "Enter"){ e.preventDefault(); if (ex.answered) nextExercise(false); else if (ex.type === "type") typeSubmit(); else if ((ex.type === "build_s" || ex.type === "build_w") && ex.placed.length) finishAnswer(buildCheck(ex)); return; }
    if (/^[1-4]$/.test(e.key) && ex.opts && !ex.answered){ const i = +e.key - 1; if (i < ex.opts.length){ ex.chosen = i; finishAnswer(i === ex.correct); } return; }
    if (e.key === "Backspace" && ex.placed && ex.placed.length && !ex.answered){ e.preventDefault(); const k = ex.placed.length - 1; ex.bank[ex.placed[k]].used = false; ex.placed.splice(k, 1); render(); }
  } else if (VIEW.name === "flash" && FC){
    if (e.key === " "){ e.preventDefault(); ACTIONS.fcflip(); }
    else if (e.key === "ArrowRight") ACTIONS.fcnext();
    else if (e.key === "ArrowLeft") ACTIONS.fcprev();
  }
});
Object.assign(ACTIONS, LIVE_ACTIONS, CLOUD_ACTIONS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && VIEW.name === "home") render(); });

  get STATS(){ return STATS; }, get PROG(){ return PROG; }, get SETTINGS(){ return SETTINGS; }, get SESSION(){ return SESSION; }, get VIEW(){ return VIEW; },
  setClock(fn){ clock = fn; }, voiceOK, render, pickVoice, esc, INTERVALS, weekKey, weekXp, CL, cloudFlush, ONLINE };
if (ONLINE) cloudInit();
render();
